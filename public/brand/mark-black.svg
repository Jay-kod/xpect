    <!-- Analytics Histogram Bars -->
    <!-- Bar 1 (Medium-low - Deep Dark Orange) -->
    <rect x="21" y="48" width="9.5" height="40" rx="2.5" fill="#D94E00"/>
    <!-- Bar 2 (Tallest / Peak - Pure White) -->
